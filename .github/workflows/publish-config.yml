name: Publish @ghostery/config

on:
  push:
    branches:
      - main
    paths:
      - 'packages/config/src/**'
      - '.github/workflows/publish-config.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the version to bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# One publish at a time, so two runs cannot pick the same version.
concurrency:
  group: publish-config
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch can run on any branch. Publish only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./packages/config
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run test
      - run: npm run build

      - name: Publish the next version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          # npm is the source of truth for the version. CI does not write it back to git.
          LATEST=$(npm view @ghostery/config version)
          npm version "$LATEST" --no-git-tag-version --allow-same-version
          npm version "$BUMP" --no-git-tag-version
          npm publish --provenance --access public
